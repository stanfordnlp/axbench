[project]
name = "axbench"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncio>=3.4.3",
    "datasets>=3.0.2",
    "einops>=0.8.0",
    "httpx>=0.27.2",
    "openai>=1.52.1",
    "pyvene>=0.1.8",
    "torch>=2.5.0",
    "transformers>=4.42.4",
    "wandb>=0.18.5",
    "scikit-learn>=1.5.2",
    "seaborn>=0.12.2",
    "pyreft>=0.0.8",
    "peft>=0.16",
    "jupyter>=1.1.1",
    "adjusttext>=1.3.0",
    "altair>=5.5.0",
    "umap-learn>=0.5.7",
    "stanza>=1.11.0",
]

# latentqa and activation_oracles have pinned deps that conflict with axbench.
# Clone into axbench/models/ instead — they are auto-discovered on sys.path:
#   cd axbench/models && git clone https://github.com/aypan17/latentqa.git _latentqa
#   cd axbench/models && git clone https://github.com/adamkarvonen/activation_oracles.git _activation_oracles

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
